name: Bug
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, or the build's branch and commit.
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
  - type: textarea
    id: shots
    attributes:
      label: Screenshots or logs
      description: Drag images or files in here.
